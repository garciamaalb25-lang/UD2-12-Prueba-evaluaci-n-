<div class="card h-100 shadow-sm">
    <div class="card-body">
        <h5 class="card-title">{{ vehicle()?.name }}</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">{{ vehicle()?.model }}</h6>
        <ul class="list-unstyled card-text">
            <li><strong>Fabricante:</strong> {{ vehicle()?.manufacturer }}</li>
            <li><strong>Clase:</strong> {{ vehicle()?.vehicle_class }}</li>
            <li><strong>Pasajeros:</strong> {{ vehicle()?.passengers }}</li>
        </ul>
    </div>
    <div class="card-footer bg-transparent border-0">
        <button type="button" class="btn btn-primary" (click)="emitVehicleClicked()">Ver detalle</button>
    </div>
</div>
